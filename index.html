  L.push(htmlText(warReportHTML('allied', full || me() === 'allied')), htmlText(warReportHTML('axis', full || me() === 'axis')));
  L.push('', 'TURN BY TURN');
  for (const t of [...new Set(S.log.map((l) => l.t))].sort((a, b) => a - b)) {
    const g = S.log.filter((l) => l.t === t && l.cls !== 'turn'), who = (g.find((l) => l.who) || {}).who;
    L.push('', `Turn ${t}${who ? ' (' + SIDE[who] + ')' : ''}`);
    for (const l of g) L.push(`  ${l.kind === 'raid' ? '[' + opName(l.stage) + '] ' : ''}${pubMsg(l)}${l.detail ? ' (' + l.detail + ')' : ''}`);
  }
  return L.join('\n') + '\n';
}
function archive() {
  // Finished games are kept on this device so several can be exported together.
  if (!over()) return;
  const gid = S.gid || `g${S.rng}-${S.log.length}`; // games started before ids existed
  const h = loadHist(); if (h.some((x) => x.gid === gid)) return;
  h.push({ gid, text: reportText() }); while (h.length > 30) h.shift();
  try { localStorage.setItem(HKEY, JSON.stringify(h)); } catch (e) {}
}
let exportBox = null; // { text, filename, msg } shown in a sheet when saving isn't available
function exportText(text, filename) {
  // Copy straight to the clipboard (must run inside the tap). If the browser refuses, show the text to copy by hand.
  menu = false;
  const fail = () => { exportBox = { text, filename, msg: 'Your browser blocked copying. Tap in the box, select all, and copy.' }; render(); };
  const ok = () => { exportBox = { text, filename, msg: 'Copied to your clipboard. Paste it into the chat with Claude.', copied: true }; render(); };
  try { navigator.clipboard.writeText(text).then(ok, fail); } catch (e) { fail(); }
}
function exportHTML() {
  if (!exportBox) return '';
  return `<div class="sheet-wrap"><div class="sheet" role="dialog" aria-label="Game report"><h3>${exportBox.title || (exportBox.copied ? 'Report copied' : 'Copy the report')}</h3><p class="note">${esc(exportBox.msg)}</p>
    ${exportBox.copied ? '' : `<textarea id="export-text" readonly style="width:100%;height:300px;font:500 11px/1.4 var(--f-mono);background:var(--sea);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px">${esc(exportBox.text)}</textarea>`}
    ${btn('closeExport', 'Done', { cls: 'go' })}</div></div>`;
}
/* Full screen: takes over the screen where the browser allows it (desktop browsers, Android Chrome). iPhone Safari doesn't. */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFullscreen() {
  menu = false;
  const el = document.documentElement;
  const notice = () => { exportBox = { text: '', filename: '', title: 'Full screen not available', copied: true,
    msg: 'This browser doesn\u2019t let pages go full screen here. iPhone and iPad allow it only for videos. Opening the game from the artifact\u2019s full-screen view in the Claude app gives the most room.' }; render(); };
  try {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); render(); return; }
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return notice();
    const pr = req.call(el, { navigationUI: 'hide' });
    if (pr && pr.then) pr.then(() => render(), notice); else render();
  } catch (e) { notice(); }
}
document.addEventListener('fullscreenchange', () => { fit(); render(); });
document.addEventListener('webkitfullscreenchange', () => { fit(); render(); });
function menuHTML() {
  if (!menu) return '';
  return `<div class="sheet-wrap" data-btn="closeMenu"><div class="sheet" role="dialog" aria-label="Menu"><h3>${esc(modeName())}</h3>
    <p class="note">${aiSide() ? `You (${SIDE[human()]}) vs the computer` : 'Pass and play'} · turn ${S.turnNo}</p>
    ${btn('undo', 'Undo last move', { dis: !hist.length || over() })}${btn('fullscreen', fsEl() ? 'Exit full screen' : 'Full screen')}${btn('exportGame', over() ? 'Copy game report' : 'Copy game report so far')}${loadHist().length ? btn('exportAll', `Copy reports of all finished games (${loadHist().length})`) : ''}${btn('toStart', 'Main menu')}${btn('openNew', 'New game')}${btn('closeMenu', 'Close', { cls: 'go' })}</div></div>`;
}
function render() {
  repInline = false;
  const app = document.getElementById('app');
  const keep = document.getElementById('main'), top = keep ? keep.scrollTop : 0, prevTab = app.dataset.tab;
  if (rules) { app.innerHTML = frame('How to play', [['basics', 'Basics'], ['turn', 'Your turn'], ['combat', 'Combat'], ['modes', 'Modes']], rulesPage(rulesTab),
    { noNav: true, noMenu: true, noStatus: !S || startScreen, seg: rulesTab, segBtn: 'rtab' }); const mn = document.getElementById('main'); if (mn) mn.scrollTop = 0; return; }
  if (startScreen) { app.innerHTML = startHTML(); return; }
  if (showNew) { app.innerHTML = frame('New game', null, newHTML(), { noNav: true, noMenu: true, noStatus: true }); return; }
  const v = viewer();
  if (human()) shownFor = human();
  // Reports for whoever last held the device (vs computer: wait while it acts, except your own turn's results).
  const ownTurnOver = aiTurn() && S.active === aiSide();
  const reps = !over() && shownFor && (!aiTurn() || ownTurnOver) ? unseen(shownFor).filter((r) => !aiTurn() || r.summary !== undefined || r.who === human()) : [];
  // Pass and play: the previous player finishes reading their reports before handing over.
  if (reps.length && shownFor !== v) {
    const now = reps.filter((r) => r.summary === undefined);
    app.innerHTML = `<div class="frame"><div class="cover"><div class="cover-box ${shownFor}"><span class="label">Situation report</span><div class="who">${SIDE[shownFor]} player</div>
      <div class="rep-scroll">${reps.filter((r) => r.summary !== undefined).map((r) => turnHTML(r.summary, true)).join('')}
      ${now.length ? `<section class="aar-box fresh"><ul class="rep-list">${now.map((r) => `<li class="side-${r.side || ''}">${esc(pubMsg(r))}</li>`).join('')}</ul></section>` : ''}</div>
      ${btn('repSkip', 'Done, pass the device', { cls: 'go' })}</div></div></div>`;
    return;
  }
  scheduleAI();
  if (!over() && shownFor !== v) {
    app.innerHTML = `<div class="frame"><div class="cover"><div class="cover-box ${v}"><span class="label">Pass the device</span><div class="who">${SIDE[v]} player</div>
      <p>${esc(phaseBlurb())}</p><p class="note">${SIDE[E.other(v)]} player: look away. Your hand stays hidden until ${SIDE[v]} confirms.</p>
      ${btn('reveal', `I'm the ${SIDE[v]} player`, { cls: 'go' })}${btn('openNew', 'New game')}</div></div></div>`;
    return;
  }
  // A new decision or new reports bring you back to Orders.
  const k = decisionKey() + '|' + reps.length;
  const mustAct = !over() && !aiTurn() && E.actorOf(S) === v;
  if (k !== lastKey) { if ((mustAct && decisionKey() !== lastKey.split('|').slice(0, 7).join('|')) || reps.length) tab = 'orders'; lastKey = k; }
  const m = me();
  if (!sub.bases) sub.bases = m;
  if (!sub.planes) sub.planes = m;
  const sideSegs = (extra) => [['allied', 'Allied', 'sd-allied'], ['axis', 'Axis', 'sd-axis']].concat(extra || []);
  const unreadN = new Set(unseen(m).map((r) => (r.summary !== undefined ? r.summary : r.t))).size;
  const badges = { orders: reps.length || mustAct ? true : 0, reports: !over() && unreadN && tab !== 'orders' ? unreadN : 0 };
  let html;
  archive();
  const o = { badges, overlay: menuHTML() + exportHTML() };
  if (tab === 'orders') html = frame('Orders', null, ordersPage(reps), o);
  else if (tab === 'strategy') html = frame('Strategy', [['sit', 'Situation report'], ['vc', 'Victory conditions']],
    sub.strategy === 'sit' ? clockHTML() + sitRep(m) + sitRep(E.other(m)) : victoryHTML(), Object.assign(o, { seg: sub.strategy }));
  else if (tab === 'bases') html = frame('Airbases and carriers', sideSegs(), basesPage(sub.bases), Object.assign(o, { seg: sub.bases }));
  else if (tab === 'planes') html = frame('Aircraft', sideSegs([['hand', 'Hand', '']]), sub.planes === 'hand' ? handPage() : planesPage(sub.planes), Object.assign(o, { seg: sub.planes }));
  else html = frame('Reports', [['aar', 'After action'], ['log', 'Full log'], ['war', 'War record']], reportsPage(sub.reports), Object.assign(o, { seg: sub.reports }));
  app.innerHTML = html;
  app.dataset.tab = tab + '|' + (sub[tab] || '');
  const mn = document.getElementById('main');
  if (mn && prevTab === app.dataset.tab) mn.scrollTop = top;
}

/* ---------------------------------------------------------------- input */
function onBtn(id, arg) {
  const c = S.combat;
  switch (id) {
    case 'tab': tab = arg; menu = false; break;
    case 'sub': sub[tab] = arg; break;
    case 'menu': menu = true; break;
    case 'rules': rules = !rules; menu = false; break;
    case 'startContinue': startScreen = false; break;
    case 'startNewGame': startScreen = false; showNew = true; break;
    case 'startHow': rules = true; rulesTab = 'basics'; break;
    case 'toStart': startScreen = true; menu = false; showNew = false; break;
    case 'rtab': rulesTab = arg; break;
    case 'closeMenu': menu = false; break;
    case 'exportGame': { const nmf = modeName().replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, ''); exportText(reportText(), `airwar-${nmf}-turn${S.turnNo}.txt`); return; }
    case 'exportAll': exportText(loadHist().map((x) => x.text).join('\n' + '='.repeat(60) + '\n\n'), `airwar-games-${loadHist().length}.txt`); return;
    case 'closeExport': exportBox = null; break;
    case 'fullscreen': toggleFullscreen(); return;
    case 'reveal': shownFor = viewer(); save(); break;
    case 'undo': menu = false; if (hist.length) { S = hist.pop(); while (hist.length && aiTurn()) S = hist.pop(); if (aiTimer) { clearTimeout(aiTimer); aiTimer = null; } ui = fresh(); err = ''; shownFor = viewer(); for (const k in seen) seen[k] = Math.min(seen[k], S.log.length); seen[shownFor] = S.log.length; save(); } break;
    case 'repSkip': seen[shownFor] = S.log.length; save(); break;
    case 'openNew': showNew = true; menu = false; break;
    case 'cancelNew': showNew = false; if (!inProgress()) startScreen = true; break;
    case 'startNew': newGame(); break;
    case 'mob': { const [at, cover] = (arg && arg !== 'undefined' ? arg : '').split('|');
      return act({ type: 'mobilize', uid: ui.sel[0], attach: at || undefined, cover: cover || undefined }); }
    case 'endMob': return act({ type: 'endMobilization' });
    case 'target': { const [kind, uid] = arg.split('|'); ui.target = { kind, uid: uid ? +uid || uid : undefined }; break; }
    case 'launch': return act({ type: 'launch', target: ui.target, cards: ui.sel, special: ui.special && ui.target && ui.target.kind === 'airbase' ? ui.special : undefined });
    case 'special': ui.special = ui.special ? null : +arg || arg; break;
    case 'hypo': return act({ type: 'special', uid: +arg || arg });
    case 'pickOpening': return act({ type: 'pickOpening', uids: ui.sel });
    case 'skip': return act({ type: 'skipStage' });
    case 'scramble': return act({ type: 'intercept', cards: ui.sel });
    case 'letThrough': return act({ type: 'intercept', cards: [] });
    case 'squall': return act({ type: 'squall', uid: +arg || arg || E.squallOptions(S)[0] });
    case 'pickOpt': { const x = isNaN(+arg) ? arg : +arg; ui.sel = ui.sel[0] === x ? [] : [x]; break; }
    case 'declineWar': return act({ type: 'choose', uids: [] });
    case 'lrfSub': ui.sub = ui.sub === arg ? null : arg; break;
    case 'landTo': { const [u, x] = arg.split('|'); ui.landAsg = ui.landAsg || {}; ui.landAsg[u] = isNaN(+x) ? x : +x; break; }
    case 'landGo': return act({ type: 'land', assign: ui.landAsg || {} });
    case 'engage': return act(ui.strike ? { type: 'engage', mode: 'strike', own: ui.own, target: ui.strike, battle: ui.battle || undefined }
                                        : { type: 'engage', mode: 'intercept', own: ui.own, slot: ui.slot });
    case 'endCombat': return act({ type: 'endCombat' });
    case 'yield': return act({ type: 'yield' });
    case 'respond': return act({ type: 'respond', battle: ui.battle, sub: ui.sub || undefined });
    case 'noRespond': return act({ type: 'respond', battle: null });
    case 'alloc': { const split = {}; for (const m of c.mission) if (m.alive) split[m.uid] = ui.split[m.uid] || 'industry'; return act({ type: 'allocate', split }); }
    case 'choose': return act({ type: 'choose', uids: ui.sel });
  }
  render();
}
function toggle(arr, u, max) { const i = arr.indexOf(u); if (i >= 0) arr.splice(i, 1); else if (arr.length < max) arr.push(u); else return false; return true; }
function onPick(el) {
  err = '';
  if (el.dataset.slot !== undefined) { ui.slot = +el.dataset.slot; ui.strike = null; return render(); }
  const raw = el.dataset.card, u = isNaN(+raw) ? raw : +raw, zone = el.dataset.zone, p = S.players[viewer()];
  switch (S.phase) {
    case 'mobilize': ui.sel = ui.sel[0] === u ? [] : [u]; break;
    case 'attack': { const cap = E.availCap(S, p, E.launchKind(S)); if (!toggle(ui.sel, u, cap)) err = `Your ${E.launchKind(S)} capacity is ${cap}.`; break; }
    case 'intercept': toggle(ui.sel, u, 99); break;
    case 'combat':
      if (zone === 'hand') ui.battle = ui.battle === u ? null : u;
      else if (zone === 'own') { ui.own = ui.own === u ? null : u; if (ui.battle && !(ui.own && E.battleFits(S, ui.battle, ui.own))) ui.battle = null; }
      else if (zone === 'theirs') { ui.strike = ui.strike === u ? null : u; ui.slot = null; }
      break;
    case 'respond': if (zone === 'sub') ui.sub = ui.sub === u ? null : u; else { ui.battle = ui.battle === u ? null : u; ui.sub = null; } break;
    case 'allocate': ui.split[u] = (ui.split[u] || 'industry') === 'industry' ? 'convoy' : 'industry'; break;
    case 'choice': toggle(ui.sel, u, Math.min(S.pending[0].count, E.choiceOptions(S).length)); break;
    case 'setup': {
      const i = ui.sel.indexOf(u);
      if (i >= 0) { ui.sel.splice(i, 1); break; }
      const spent = ui.sel.reduce((n, x) => n + E.costOf(S.cards[x]), 0) + E.costOf(S.cards[u]);
      if (ui.sel.length >= E.buyLimits(S).picks) err = `You can pick at most ${E.buyLimits(S).picks} cards.`;
      else if (spent > E.buyLimits(S).budget) err = `That would cost ${spent} points; your budget is ${E.buyLimits(S).budget}.`;
      else ui.sel.push(u);
      break;
    }
  }
  render();
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-btn]');
  if (b && b.classList.contains('sheet-wrap') && e.target !== b) { /* clicks inside the sheet fall through to its buttons */ }
  if (b && !b.disabled && !(b.classList.contains('sheet-wrap') && e.target !== b)) return onBtn(b.dataset.btn, b.dataset.arg);
  const c = e.target.closest('[data-card],[data-slot]'); if (c) onPick(c);
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-card],[data-slot]')) { e.preventDefault(); onPick(e.target); }
  if (e.key === 'Escape' && menu) { menu = false; render(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'opt-home') newOpts.indestructibleHome = e.target.checked;
  if (e.target.id === 'opt-single') newOpts.singleMobilization = e.target.checked;
  if (e.target.id === 'opt-exp') newOpts.expansion1942 = e.target.checked;
  if (e.target.id === 'opt-keep') newOpts.drawKeep = e.target.checked;
  if (e.target.id === 'opt-convoy') newOpts.convoyDiscards = e.target.checked ? 1 : 2;
  if (e.target.name === 'mode') { newOpts.mode = e.target.value; applyBalance(); render(); }
  if (e.target.name === 'opp') { newOpts.ai = e.target.value ? { side: e.target.value, profile: (newOpts.ai && newOpts.ai.profile) || 'balanced' } : null; render(); }
  if (e.target.id === 'opt-style' && newOpts.ai) newOpts.ai.profile = e.target.value;
  if (e.target.id === 'opt-surprise') newOpts.surpriseAttack = e.target.checked;
  if (e.target.id === 'opt-bonus') newOpts.bonusCards = +e.target.value ? { axis: +e.target.value } : undefined;
  if (e.target.name === 'scen') { newOpts.scenario = e.target.value; applyBalance(); render(); }
});

window.claude?.hot?.snapshot?.(() => ({ S, hist, shownFor, seen, intel, tab, startScreen }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
