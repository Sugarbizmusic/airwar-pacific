<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Airwar Pacific">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Airwar Pacific!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a 375 x 812 phone app. Header (status + page title), optional segmented sub-nav, one scrolling page,
   bottom nav: Orders | Strategy | Bases | Planes | Reports. Full screen on phones, scaled to fit on desktop.
   Single committed dark look: ops-room sea blues, Allied blue, Axis red, olive Attack Missions, teal Carrier Strikes. */
:root {
  color-scheme: dark;
  --sea: #0e1a21; --sea-2: #142530; --sea-3: #1c3240; --line: #2b4553; --nav: #09141a; --desk: #05090c;
  --fg: #dbe4e4; --muted: #8fa3a8; --dim: #5f7479; --paper: #e6e2d3; --paper-2: #d4cfbd; --ink: #1b2226; --ink-2: #55615f;
  --allied: #3f82dc; --allied-soft: #24486f; --allied-panel: #11273a; --allied-text: #9cc2f2;
  --axis: #e1483b; --axis-soft: #6d2a25; --axis-panel: #331816; --axis-text: #f2a39b;
  --op-airbase: #9cc25a; --op-airbase-soft: #2c3b1c; --op-carrier: #34c3cf; --op-carrier-soft: #133c42;
  --signal: #f0b23a; --kill-ink: #c8281a; --ok: #6cc28a; --kill: #ff6f5f;
  --f-display: "Big Shoulders Stencil Display", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
html, body { height: 100%; margin: 0; background: var(--desk); color: var(--fg); }
body { font: 14px/1.4 var(--f-body); overflow: hidden; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button { font: 600 12.5px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; color: var(--fg);
  border: 1px solid var(--line); background: var(--sea-3); padding: 11px 12px; border-radius: 4px; min-height: 40px; }
button:disabled { opacity: .38; cursor: not-allowed; }
button.go { background: var(--signal); color: var(--ink); border-color: var(--signal); }
button.chip { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 13px; padding: 8px 10px; min-height: 36px; text-align: left; }
button.chip.on { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); color: var(--signal); }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
svg { display: block; }

/* ---------------- frame */
#app { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 30%, #102029, var(--desk) 70%); }
.frame { position: relative; width: 375px; height: 812px; flex: none; transform: scale(var(--k, 1)); border-radius: 46px; overflow: hidden;
  background: var(--sea); box-shadow: 0 0 0 9px #020507, 0 0 0 10px #1d2a30, 0 30px 80px rgba(0,0,0,.7);
  display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }
html.mobile #app { background: var(--sea); }
/* Home-screen app: an opaque status bar (set in the GitHub page head) keeps the page below it; just match the background. */
html.standalone, html.standalone body { background: var(--sea); }
html.mobile .frame { width: 100%; height: 100%; transform: none; border-radius: 0; box-shadow: none; }

.hdr { padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gut-r) 10px var(--gut-l); display: grid; gap: 6px; }
html:not(.mobile) .hdr { padding-top: 26px; }
.hdr-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.hdr-bar { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; height: 59px; }
.hdr-bar .logo { justify-self: center; height: 59px; display: grid; place-items: center; }
/* Designer's logo, a 2x PNG (199 x 117) shown at half size. */
.hdr-bar .logo img { width: 99.5px; height: 58.5px; display: block; }
.iconbtn { width: 44px; height: 40px; min-height: 0; padding: 0; display: grid; place-items: center; background: none; border: 0; color: var(--fg); }
.iconbtn.on { color: var(--signal); }
.rules { display: grid; gap: 12px; }
.rules h3 { margin: 6px 0 0; font: 800 20px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--signal); }
.rules h4 { margin: 4px 0 0; font: 600 12px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); }
.rules p, .rules li { font-size: 14.5px; line-height: 1.45; }
.rules ul, .rules ol { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.rules b { color: #fff; }
.rules .tbl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding: 10px 12px; background: var(--sea-2); border-radius: 6px; font-size: 13.5px; }
.rules .tbl .k { font: 600 11px/1.6 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.rules .box { padding: 10px 12px; background: var(--sea-2); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 6px; }
.status { font: 600 10.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.status b { color: var(--fg); font-weight: 600; }
.status .s-allied { color: var(--allied-text); } .status .s-axis { color: var(--axis-text); }
.status .st-airbase { color: var(--op-airbase); } .status .st-carrier { color: var(--op-carrier); }
.more { width: 44px; height: 32px; min-height: 0; padding: 0; display: grid; place-items: center; background: none; border: 0; color: var(--fg); }
.ptitle { margin: 0; font: 800 31px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin: 0 var(--gut-r) 2px var(--gut-l); border-radius: 3px; overflow: hidden; background: var(--sea-2); }
.seg button { min-height: 30px; padding: 7px 4px; border: 0; border-radius: 0; background: var(--sea-2); color: var(--muted); font: 600 10.5px/1 var(--f-mono); letter-spacing: .16em; }
.seg button + button { border-left: 1px solid var(--sea); }
.seg button.on { background: #4a5c63; color: #fff; }
.seg button.sd-allied { background: var(--allied-panel); color: var(--allied-text); }
.seg button.sd-axis { background: var(--axis-panel); color: var(--axis-text); }
.seg button.sd-allied.on { background: var(--allied); color: #fff; }
.seg button.sd-axis.on { background: var(--axis); color: #fff; }

.main { overflow-y: auto; overflow-x: hidden; padding: 14px var(--gut-r) 18px var(--gut-l); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.main > * { flex: none; }

.nav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--nav); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
html:not(.mobile) .nav { padding-bottom: 18px; }
.nav button { position: relative; background: none; border: 0; border-radius: 0; min-height: 58px; padding: 9px 0 7px; display: grid; justify-items: center; gap: 4px;
  color: var(--dim); font: 600 9px/1 var(--f-mono); letter-spacing: .1em; }
.nav button svg { width: 26px; height: 26px; }
.nav button.on { color: var(--fg); }
.nav button.on::before { content: ""; position: absolute; top: -1px; left: 26%; right: 26%; height: 2px; background: var(--signal); }
.nav .badge { position: absolute; top: 7px; left: calc(50% + 7px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--signal); color: var(--ink);
  font: 700 10px/16px var(--f-mono); letter-spacing: 0; }
.nav .badge.dot { min-width: 10px; width: 10px; height: 10px; padding: 0; top: 9px; }

/* ---------------- shared bits */
.label { font: 600 10.5px/1.2 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sec-h { font: 800 18px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 -4px; }
.note { font: 500 11.5px/1.4 var(--f-mono); color: var(--muted); margin: 0; }
.hint { color: var(--muted); font-size: 13px; }
p { margin: 0; }
.err { color: var(--kill); font: 500 12.5px/1.35 var(--f-mono); }
.flag { flex: none; border-radius: 1.5px; box-shadow: 0 0 0 .5px rgba(0,0,0,.35); }
.flags { display: inline-flex; gap: 6px; align-items: center; }
.op { display: inline-flex; align-items: center; gap: 5px; font: 600 10.5px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; }
.op-airbase { background: var(--op-airbase-soft); color: var(--op-airbase); box-shadow: inset 0 0 0 1px var(--op-airbase); }
.op-carrier { background: var(--op-carrier-soft); color: var(--op-carrier); box-shadow: inset 0 0 0 1px var(--op-carrier); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { font: 600 10px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px; border-radius: 3px; background: var(--sea-3); color: var(--fg); }
.pill.allied { background: var(--allied); color: #fff; } .pill.axis { background: var(--axis); color: #fff; }
.pill.unk { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.pill.warn { background: var(--kill); color: var(--ink); } .pill.sig { background: var(--signal); color: var(--ink); }

/* ---------------- cards (paper stock with a faction band, like the printed deck) */
.cgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.cgrid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.card { position: relative; border-radius: 6px; background: var(--paper); color: var(--ink); overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 2px 6px rgba(0,0,0,.35); text-align: left; min-width: 0; transition: transform .12s ease, box-shadow .12s ease; }
.band { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 6px 8px; font: 600 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: #fff; }
.band span { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; }
.card.allied .band { background: var(--allied); } .card.axis .band { background: var(--axis); }
.card.elite .band { background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(255,255,255,.2) 6px 9px); }
.cname { font: 600 15px/1.12 var(--f-body); padding: 7px 8px 6px; text-wrap: balance; display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
.cname .cmark { flex: none; color: #24486f; margin-top: 1px; }
.cname .cmark.pf { color: #2a2f2c; }
.ctext.pfx { color: var(--ink); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 0 7px; border: 1px solid var(--paper-2); border-radius: 3px; }
.stats.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.stats div { display: grid; justify-items: center; padding: 3px 0 2px; }
.stats div + div { border-left: 1px solid var(--paper-2); }
.stats span { font: 600 8.5px/1 var(--f-mono); letter-spacing: .03em; color: var(--ink-2); }
.stats b { font: 600 16px/1.15 var(--f-mono); font-variant-numeric: tabular-nums; }
.stats b.z { color: var(--paper-2); }
.stats b.down { color: var(--kill-ink); }
.stats b.up { color: #1f7a3c; }
.cmeta { font: 600 9.5px/1.25 var(--f-mono); color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; padding: 7px 8px 8px; }
.ctext { font: 400 11.5px/1.3 var(--f-body); color: var(--ink-2); padding: 0 8px 8px; }
.cfoot { margin-top: auto; font: 700 10px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 6px 8px; background: var(--ink); color: var(--paper); }
.cfoot.f-hand { background: var(--signal); color: var(--ink); }
.cfoot.f-enemy { background: var(--kill-ink); color: #fff; }
.kills { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 0 8px 6px; }
.kills .flag { box-shadow: 0 0 0 .5px rgba(0,0,0,.5); }
.kflags, .bombs { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; }
.kflags + .bombs { margin-left: 4px; }
.ace { font: 700 8.5px/1 var(--f-mono); letter-spacing: .12em; background: var(--signal); color: var(--ink); padding: 3px 5px; border-radius: 2px; margin-right: 3px; }
.card.is-ace { box-shadow: 0 0 0 2px var(--signal), 0 2px 6px rgba(0,0,0,.35); }
.card.sm .kills { padding: 0 6px 4px; }
.aces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 600 11px/1.3 var(--f-mono); }
.rep-list .ace-line, .logl li.ace { color: var(--signal); font-weight: 600; }
.card.landed { opacity: .5; }
.card.landed .cfoot { background: #3c4648; color: var(--paper); }
/* small cards: three to a row in the air battle and in pick lists */
.card.sm .band { padding: 4px 6px; font-size: 8.5px; gap: 4px; }
.card.sm .band span { gap: 4px; }
.card.sm .cname { font-size: 12.5px; padding: 5px 6px 4px; line-height: 1.08; min-height: 2.36em; }
.card.sm .stats { margin: 0 4px 5px; }
.card.sm .stats span { font-size: 7px; }
.card.sm .stats b { font-size: 13px; }
.card.sm .ctext { font-size: 10.5px; padding: 0 6px 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card.sm .cfoot { font-size: 8px; padding: 4px 6px; }
.card.pick { cursor: pointer; box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--signal) 55%, transparent), 0 2px 6px rgba(0,0,0,.35); }
.card.sel { box-shadow: 0 0 0 3px var(--signal), 0 6px 14px rgba(0,0,0,.45); transform: translateY(-2px); }
.card.dim { opacity: .4; filter: grayscale(.85); }
.card.dead { filter: grayscale(1); opacity: .55; }
.card.dead::after { content: "DOWN"; position: absolute; inset: 42% 0 auto; text-align: center; font: 800 20px/1 var(--f-display); color: var(--kill); transform: rotate(-12deg); }
.card .new { position: absolute; top: 0; right: 6px; font: 700 8.5px/1 var(--f-mono); letter-spacing: .1em; background: var(--signal); color: var(--ink); padding: 3px 5px; border-radius: 0 0 3px 3px; }
/* hidden aircraft: small card backs */
.backs { display: flex; flex-wrap: wrap; gap: 6px; }
.back { width: 46px; height: 60px; border-radius: 5px; border: 1px dashed var(--muted); display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted);
  background: var(--sea-3) repeating-linear-gradient(45deg, transparent 0 6px, rgba(255,255,255,.035) 6px 12px); }
.back b { font: 800 22px/1 var(--f-display); }
.back small { font: 600 8.5px/1 var(--f-mono); }
.back.pick { cursor: pointer; border-style: solid; border-color: var(--fg); color: var(--fg); }
.back.sel { border: 2px solid var(--signal); color: var(--signal); }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card.sel { transform: none; } }

/* ---------------- orders */
.ord-head { display: grid; gap: 7px; }
.ord-head h2 { margin: 0; font: 800 23px/1.02 var(--f-display); text-transform: uppercase; letter-spacing: .02em; text-wrap: balance; }
.ord-head h2.c-airbase { color: var(--op-airbase); } .ord-head h2.c-carrier { color: var(--op-carrier); } .ord-head h2.c-sig { color: var(--signal); }
.ord-head p { font-size: 14px; }
.est { font: 500 12px/1.45 var(--f-mono); background: var(--sea-2); padding: 8px 10px; border-radius: 4px; }
.est b { color: var(--signal); }
.actions { position: sticky; bottom: -18px; margin: auto calc(-1 * var(--gut-r)) -18px calc(-1 * var(--gut-l)); padding: 12px var(--gut-r) 14px var(--gut-l);
  background: linear-gradient(to bottom, transparent, var(--sea) 14px); display: flex; flex-wrap: wrap; gap: 8px; z-index: 2; }
.actions button { flex: 1 1 140px; }
.actions button.go { flex-grow: 2; }
.trows { display: grid; gap: 6px; }
.trow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; text-align: left; text-transform: none; letter-spacing: 0; font: 500 14px/1.2 var(--f-body);
  padding: 9px 10px; background: var(--sea-2); }
.trow small { display: block; font: 500 11px/1.3 var(--f-mono); color: var(--muted); margin-top: 3px; }
.trow .tv { font: 600 12px/1 var(--f-mono); color: var(--muted); }
.trow.on { border-color: var(--signal); box-shadow: inset 0 0 0 1px var(--signal); }
.trow.on .tv { color: var(--signal); }
.trow svg { color: var(--muted); }
.battle { border-radius: 8px; border: 1px solid var(--line); padding: 10px; display: grid; gap: 10px; background: var(--sea-2); }
.battle.stage-airbase { border-color: color-mix(in srgb, var(--op-airbase) 60%, transparent); }
.battle.stage-carrier { border-color: color-mix(in srgb, var(--op-carrier) 60%, transparent); }
.lane { display: grid; gap: 6px; }
.lane-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.lane-h .label.allied { color: var(--allied-text); } .lane-h .label.axis { color: var(--axis-text); }
.duel { display: grid; gap: 5px; padding: 8px 10px; background: var(--sea); border-radius: 4px; font: 500 12px/1.4 var(--f-mono); }
.duel .k { color: var(--kill); } .duel .s { color: var(--ok); }
.duel-row { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.duel-name { font-weight: 600; flex-basis: 100%; }
.land-row { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--line); }
.land-row .ln { font: 600 14px/1.2 var(--f-body); }
.wait { display: grid; gap: 10px; padding: 20px 4px; }
.wait p::after { content: ""; display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 50%; background: var(--signal); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
@media (prefers-reduced-motion: reduce) { .wait p::after { animation: none; } }

/* after-action reports */
.aar-box { border-radius: 8px; border: 1px solid var(--line); background: var(--sea-2); padding: 12px; display: grid; gap: 10px; }
.aar-box.fresh { border-color: var(--signal); }
.rep-ctx { font: 600 11px/1.3 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--signal); }
.rep-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.rep-list > li { padding-left: 10px; border-left: 3px solid var(--line); display: grid; gap: 4px; font-size: 14px; }
.rep-list > li.side-axis { border-left-color: var(--axis); } .rep-list > li.side-allied { border-left-color: var(--allied); }
.rep-list small { font: 500 11.5px/1.4 var(--f-mono); color: var(--muted); }
.aar { display: grid; grid-template-columns: 78px 1fr; gap: 8px; font-size: 13.5px; }
.aar em { font: 600 9.5px/1.9 var(--f-mono); font-style: normal; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.aar-lines { display: grid; gap: 3px; min-width: 0; }
.aar-detail { display: block; font: 500 11.5px/1.4 var(--f-mono); color: var(--signal); margin-top: 2px; }
.turn-h { font: 800 19px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; display: flex; justify-content: space-between; align-items: baseline; }
.turn-h.side-axis { color: var(--axis); } .turn-h.side-allied { color: var(--allied); }
.turn-h .pill { font-size: 9px; }
.logl { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font: 500 12px/1.4 var(--f-mono); }
.logl li { padding-left: 8px; border-left: 2px solid var(--line); color: var(--muted); }
.logl li.side-axis { color: var(--axis-text); border-left-color: var(--axis); } .logl li.side-allied { color: var(--allied-text); border-left-color: var(--allied); }
.logl li.dmg { font-weight: 600; }

/* ---------------- strategy */
.clock { display: grid; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--sea-2); border: 1px solid var(--line); }
.clock-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.clock-top b { font: 800 20px/1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.ticks { display: grid; gap: 3px; height: 8px; }
.ticks i { background: var(--sea-3); border-radius: 1px; } .ticks i.on { background: var(--signal); } .ticks i.now { background: var(--fg); }
.sit { border-radius: 8px; padding: 14px 10px 16px; display: grid; gap: 14px; }
.sit.allied { background: var(--allied-panel); border: 1px solid color-mix(in srgb, var(--allied) 40%, transparent); }
.sit.axis { background: var(--axis-panel); border: 1px solid color-mix(in srgb, var(--axis) 40%, transparent); }

const ACE_KILLS = 5; // a single aircraft with this many kills is an Ace
/* Optional Ace bonus (options.aceBonus): 'flat' = +1 A2A / +1 DEF for every Ace;

            Axis Aces -1 A2A / +2 DEF (flown until they fell: worn by combat, but hard to kill). */
const ACE_BONUS = { flat: { allied: { a2a: 1, def: 1 }, axis: { a2a: 1, def: 1 } },
                    asym: { allied: { a2a: 2, def: -1 }, axis: { a2a: -1, def: 2 } } };
function aceMod(s, uid) {
  const tab = ACE_BONUS[s.options.aceBonus]; if (!tab) return { a2a: 0, def: 0 };
  const d = D(s, uid); if (d.kind !== 'aircraft') return { a2a: 0, def: 0 };
  const k = (((s.stats || {})[d.side] || {}).kills || {})[uid] || 0;
  return k >= ACE_KILLS ? tab[d.side] : { a2a: 0, def: 0 };
}
// A scenario may set a lower Industry limit (a short campaign is decided long before a nation's industry breaks).
const industryMax = (s) => { const sc = s.options.mode === 'scenario' && SCENARIOS[s.options.scenario]; return (sc && sc.industryMax) || s.options.industryMax || INDUSTRY_MAX; };

/* ------------------------------------------------------------------ helpers */
const other = (side) => (side === 'axis' ? 'allied' : 'axis');
const D = (s, uid) => CARD_DB[s.cards[uid]];
const has = (d, ab) => d.abilities.includes(ab);
const carrierCapable = (d) => d.basing === 'both' || d.basing === 'carrier';
const facs = (p, kind) => (kind === 'airbase' ? p.airbases : p.carriers);
const capOf = (s, f) => D(s, f.uid).cap + 3 * f.war.filter((w) => has(D(s, w), 'satellite')).length;
const free = (s, f) => capOf(s, f) - f.landed.length;
const usable = (s, f) => !(f.squall && f.squall > s.turnNo); // Rain Squall grounds a carrier for a round
const availCap = (s, p, kind) => facs(p, kind).reduce((n, f) => n + (usable(s, f) ? Math.max(0, free(s, f)) : 0), 0);
const findFac = (p, uid) => {
  for (const kind of ['airbase', 'carrier']) { const f = facs(p, kind).find((x) => x.uid === uid); if (f) return { f, kind }; }
  return null;

// The home base is marked on the facility itself, so a scenario can name any airbase as a side's home.
// A base's Defense, including any scenario fortification bonus.
const facDef = (s, f) => { const sc = scenarioOf(s), id = s.cards[f.uid];
  return (sc && sc.defs && sc.defs[id] != null ? sc.defs[id] : D(s, f.uid).def) + (f.fort || 0); };

/* War record for the end-of-game report: raids and damage by target, kills per aircraft, and losses. */
function stats(s, side) {

}
function raidStat(s, side, kind) { const r = stats(s, side).raids; return (r[kind] = r[kind] || { n: 0, dmg: 0, kills: 0 }); }

function rand(s) { // mulberry32
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);

const nm = (s, uid) => D(s, uid).name;
const SIDE = { axis: 'Axis', allied: 'Allied' };
/* Log entries double as the situation reports shown between moves.
   cls 'minor'/'turn' stay in the log only; o.actor marks the player whose own choice it was (they don't need a popup). */
function log(s, msg, cls, o) {
  o = o || {};
  const c = s.combat;
  s.log.push(Object.assign({ t: s.turnNo, who: s.active, msg, cls: cls || '', ctx: context(s),
    side: o.side || o.actor || (c ? c.att : s.active), raid: c ? s.raidNo : undefined, stage: c ? c.stage : s.stage }, o));
}
const RES = { industry: 'Industry', convoy: 'Convoy (shipping)', resources: 'Industry and Convoy' };
/* What an attack is called: Airbase Stage attacks are Attack Missions, Carrier Stage attacks are Carrier Strikes. */
const opName = (stage) => (stage === 'carrier' ? 'Carrier Strike' : 'Attack Mission');
const opArticle = (stage) => (stage === 'carrier' ? 'a Carrier Strike' : 'an Attack Mission');
/* Where in the game an event happened, so a report read later still makes sense. */
function context(s) {
  const c = s.combat, turn = `Turn ${s.turnNo} (${SIDE[s.active]})`;
  if (c) {
    const t = RES[c.target.kind] || `${c.target.kind} ${nm(s, c.target.uid)}`;
    return `${turn} · ${SIDE[c.att]} ${opName(c.stage)} on ${SIDE[c.def]} ${t}`;
  }
  return `${turn} · ${s.stage === 'mobilize' ? 'Mobilization' : s.stage === 'carrier' ? 'Carrier Stage' : 'Airbase Stage'}`;

/* ------------------------------------------------------------------ setup */
function newGame(opts) {
  opts = opts || {};
  const s = {
    v: 1, rng: (opts.seed | 0) || ((Math.random() * 2 ** 31) | 0) || 1, nextUid: 1, cards: {}, players: {},
    active: 'axis', turnNo: 1, stage: 'mobilize', phase: 'mobilize', mobilized: 0,
    combat: null, pending: [], after: null, log: [], winner: null, endReason: null,
    options: Object.assign({ indestructibleHome: false, singleMobilization: false, expansion1942: true, mode: 'classic', scenario: null, drawKeep: true, convoyDiscards: 2 }, opts.options || {}),
  };
  const mode = s.options.mode;
  const sc = mode === 'scenario' ? SCENARIOS[s.options.scenario] : null;
  if (mode === 'scenario' && !sc) fail('Unknown scenario.');
  if (sc && sc.needs1942) s.options.expansion1942 = true;
  if (sc) s.active = sc.first;
  else if (s.options.first) s.active = s.options.first;
  const mk = (id) => { const uid = 'c' + s.nextUid++; s.cards[uid] = id; return uid; };
  for (const side of ['axis', 'allied']) {
    const deck = DECKS[side];
    const p = s.players[side] = { deck: [], hand: [], discard: [], airbases: [], carriers: [], resWar: { industry: [], convoy: [] }, industry: 0, convoy: 0 };
    const lists = [deck.base].concat(s.options.expansion1942 ? [deck.exp1942] : []);
    const banned = new Set((sc && sc.exclude) || []);
    for (const list of lists) for (const [id, n] of Object.entries(list)) if (!banned.has(id)) for (let i = 0; i < n; i++) p.deck.push(mk(id));
    // Scenario rosters: extra copies of existing cards, added on top of the decks (even ones excluded above).
    for (const [id, n] of Object.entries((sc && sc.sides[side].extra) || {})) for (let i = 0; i < n; i++) p.deck.push(mk(id));
    const take = (id) => {
      const i = p.deck.findIndex((u) => s.cards[u] === id);
      if (i >= 0) return p.deck.splice(i, 1)[0];
      if (id === deck.home || (CARD_DB[id] && CARD_DB[id].scenario)) return mk(id);
      fail(`Setup needs a ${CARD_DB[id] ? CARD_DB[id].name : id} that isn't in the ${SIDE[side]} deck.`);
    };
    const homeId = sc ? sc.sides[side].home : deck.home;
    for (const id of sc ? sc.sides[side].inPlay : [deck.home]) facs(p, CARD_DB[id].kind).push({ uid: take(id), landed: [], war: [], hits: 0, home: id === homeId, fort: (sc && sc.fortify && sc.fortify[id]) || 0 });
    if (mode === 'basic' || mode === 'campaign') p.hand.push(...BASIC[side].map(take));
    if (sc) {
      // Scenario cards start in hand, unless listed in specialInDeck: those are shuffled into the deck to be drawn.
      const inDeck = new Set(sc.sides[side].specialInDeck || []);
      p.hand.push(...sc.sides[side].hand.map(take));
      for (const id of sc.sides[side].special || []) (inDeck.has(id) ? p.deck : p.hand).push(mk(id));
    }
    shuffle(s, p.deck);
    if (mode === 'classic') draw(s, side, 7, true);
    else if (mode !== 'pointbuy' && mode !== 'campaign') draw(s, side, 2, true);
    // Head start: extra opening cards for one side (e.g. the Axis, for Pearl Harbor and Japan's early lead).
    const bonus = (s.options.bonusCards || {})[side] || 0;
    if (bonus && mode !== 'pointbuy' && mode !== 'campaign') draw(s, side, bonus, true);
  }
  if (mode === 'pointbuy' || mode === 'campaign') {
    s.phase = 'setup'; s.stage = 'setup';
    s.setupQueue = [s.active, other(s.active)];
    log(s, mode === 'campaign' ? 'New campaign: each side customises its opening hand.' : 'New game with point-buy opening hands.', 'minor');
    return s;
  }
  log(s, sc ? `Scenario: ${sc.name}. ${SIDE[s.active]} moves first.` : `New game. ${SIDE[s.active]} moves first.`, 'minor');
  beginTurn(s, true);
  return s;
}

function draw(s, side, n, quiet) {
  const p = s.players[side]; let got = 0; const out = [];
  if (!quiet) p.fresh = [];
  for (let i = 0; i < n; i++) { if (!p.deck.length) break; const u = p.deck.pop(); p.hand.push(u); out.push(u); if (!quiet) p.fresh.push(u); got++; }
  if (!quiet) log(s, `${SIDE[side]} draws ${got} card${got === 1 ? '' : 's'}${got < n ? ' (deck empty)' : ''}.`, got < n ? '' : 'minor');
  return out;
}

function beginTurn(s, first) {
  const p = s.players[s.active];
  log(s, `— Turn ${s.turnNo}: ${SIDE[s.active]} —`, 'turn');
  if (!first) {
    if (s.options.drawKeep) {
      const got = draw(s, s.active, 3);
      if (got.length === 3) s.pending.push({ player: s.active, kind: 'keepTwo', count: 2, options: got,
        reason: 'You drew 3 cards. Keep 2; the other is shuffled back into your deck.' });
    } else draw(s, s.active, 2);
  }
  let back = 0;
  for (const kind of ['airbase', 'carrier']) for (const f of facs(p, kind)) { back += f.landed.length; p.hand.push(...f.landed); f.landed = []; }
  if (back) log(s, `${SIDE[s.active]} recovers ${back} landed aircraft to hand.`, 'minor');
}

/* ------------------------------------------------------------------ queries used by UI + engine */
function actorOf(s) {
  switch (s.phase) {
    case 'mobilize': case 'attack': return s.active;
    case 'intercept': return s.combat.def;
    case 'combat': return s.combat.turn === 'def' ? s.combat.def : s.combat.att;
    case 'respond': return s.combat.responder;
    case 'allocate': return s.combat.att;
    case 'choice': return s.pending[0].player;
    case 'setup': return s.setupQueue[0];
    default: return null;
  }
}

function removeAnywhere(s, side, uid) {
  const p = s.players[side];

    const list = facs(p, kind);

        while (f.landed.length > capOf(s, f)) p.hand.push(f.landed.pop());

function normalize(s) {

    return `${d.name} (${d[stat[0]] || 0} ${stat[1]}${mult > 1 && d[stat[0]] ? ' ×2' : ''}${pf})`; }).join(', ')}.`, 'dmg', { arrived: arriving.map((m) => m.uid) });

    if (arriving.every((m) => !D(s, m.uid).bomb && !D(s, m.uid).conv)) {

    const pKill = ds.filter((d) => f.a2a >= d.def).length / ds.length;
    // Escorts that can kill this interceptor once it is scouted take some of the sting out.
    const answer = escorts.some((d) => d.a2a >= f.def - 1) ? 0.35 : 0;
    lost += weight * pKill * (1 - answer);
  }
  lost = Math.min(lost, ds.length);
  const total = ds.reduce((x, d) => x + dmgOf(d), 0);
  const carriers = ds.filter((d) => dmgOf(d) > 0).length || 1;
  const delivered = total * Math.max(0, 1 - lost / carriers * (carriers / ds.length));
  return { delivered, lost };
}

let rngState = 1;
function seedAI(n) { rngState = (n | 0) || 1; }
function rnd() { rngState = (rngState * 1103515245 + 12345) & 0x7fffffff; return rngState / 0x7fffffff; }

const D = E.D;
const dmgCapable = (d) => d.kind === 'aircraft' && (d.bomb || d.conv || d.car);
const isFighter = (d) => d.kind === 'aircraft' && d.type === 'fighter';

/* Rough worth of a card in hand, used when keeping or discarding. */
function value(s, u) {
  const d = D(s, u);
  if (d.kind === 'aircraft') return d.a2a + Math.max(d.bomb, d.conv, d.car) + d.def / 2 + (d.basing === 'both' ? 1 : 0) + (d.elite ? 2 : 0);
  if (d.kind === 'airbase') return 3 + d.cap * 1.5;
  if (d.kind === 'carrier') return 9;
  if (d.kind === 'war') return 3;
  if (d.kind === 'battle') return d.special ? 4 : 2;
  return 1;
}

/* Value of convoy damage in "Industry points", given the discard rule in force. */
function convoyWeight(s) {
  const n = s.options.convoyDiscards ?? 2;
  return (4 + 3 * n) / E.CONVOY_MAX;
}

/* ------------------------------------------------------------------ setup / drafting */
function pickOpening(s, side) {
  const p = s.players[side], lim = E.buyLimits(s), B = lim.budget, N = lim.picks;
  // Campaign hands already hold a base, fighters and bombers: spend the few points on combat aircraft.
  const want = s.options.mode === 'campaign' ? [['fighter', 1], ['bomber', 1]] : [['airbase', 1], ['fighter', 2], ['bomber', 2]];
  const picks = []; let spent = 0;
  for (const [kind, n] of want) for (let i = 0; i < n && picks.length < N; i++) {
    const slotsLeft = N - picks.length - 1;
    const pool = p.deck.filter((u) => !picks.includes(u) && (kind === 'airbase' ? D(s, u).kind === 'airbase' : D(s, u).type === kind))
      .filter((u) => spent + E.costOf(s.cards[u]) + slotsLeft <= B)
      .sort((a, b) => value(s, b) / E.costOf(s.cards[b]) * 0.3 + value(s, b) * 0.7 - (value(s, a) / E.costOf(s.cards[a]) * 0.3 + value(s, a) * 0.7));
    if (pool.length) { picks.push(pool[0]); spent += E.costOf(s.cards[pool[0]]); }
  }
  return { type: 'pickOpening', uids: picks };
}

function keepTwo(s, side, opts) {
  const p = s.players[side];
  const bases = p.airbases.length + p.hand.filter((u) => D(s, u).kind === 'airbase').length;
  const fighters = p.hand.filter((u) => isFighter(D(s, u))).length;
  const bombers = p.hand.filter((u) => dmgCapable(D(s, u))).length;
  const score = (u) => {
    const d = D(s, u); let v = value(s, u);
    if (d.kind === 'airbase' && bases < 3) v += 6;
    if (isFighter(d) && fighters < 3) v += 3;
    if (dmgCapable(d) && bombers < 3) v += 3;
    return v;
  };
  return [...opts].sort((a, b) => score(b) - score(a)).slice(0, 2);
}

/* ------------------------------------------------------------------ mobilization */
/* Is it safe to put a(nother) carrier on the table? A carrier only gets hit hard by enemy carrier strikes
   (Carrier values double from carriers), so: safe if the enemy has no carrier in play; otherwise only with
   enough carrier-capable or Patrol fighters (or a Rain Squall) in hand to defend every carrier we'd have. */
function carrierSafe(s, side, prof) {
  const p = s.players[side], op = s.players[E.other(side)];
  if (!op.carriers.length) return true;
  // What carrier strike can the enemy put up? Seen carrier-capable bombers still alive and not landed, x2 from carriers.
  const opp = E.other(side), downed = new Set(s.downed || []);
  const landed = new Set([...op.airbases, ...op.carriers].flatMap((f) => f.landed));
  const seenStrike = ((s.seen || {})[opp] || []).map((u) => [u, D(s, u)])
    .filter(([u, d]) => d.kind === 'aircraft' && E.carrierCapable(d) && d.car && !downed.has(u) && !landed.has(u))
    .map(([, d]) => d.car * 2).sort((x, y) => y - x).slice(0, E.availCap(s, op, 'carrier')).reduce((x, y) => x + y, 0);
  const unknownStrike = Math.max(0, op.hand.length - 3) * 0.25 * 4; // a rough allowance for unseen torpedo/dive bombers
  if (prof && prof.carrierThreat && seenStrike + unknownStrike < 9) return true;
  const defenders = p.hand.filter((u) => { const d = D(s, u); return isFighter(d) && d.a2a >= 3 && (E.carrierCapable(d) || E.has(d, 'patrol')); }).length
    + (p.hand.some((u) => D(s, u).special === 'rainSquall') ? 1 : 0);
  return defenders >= (prof && prof.carrierDefenders != null ? prof.carrierDefenders : 2) + p.carriers.length;
}

function mobilize(s, side, prof) {
  const p = s.players[side];
  const can = p.hand.filter((u) => E.canMobilize(s, u));
  const order = (u) => { const d = D(s, u); return d.kind === 'airbase' ? 100 + d.cap : d.kind === 'carrier' ? 50 : 10; };
  const hasCarrierPlanes = p.hand.some((u) => D(s, u).kind === 'aircraft' && E.carrierCapable(D(s, u)) && dmgCapable(D(s, u)));
  const careful = !prof || (prof.cautious !== false && prof.carrierCare !== false);
  const pick = can.filter((u) => D(s, u).kind !== 'carrier' || (hasCarrierPlanes && (!careful || carrierSafe(s, side, prof))))
    .sort((a, b) => order(b) - order(a))[0];
  if (!pick) return { type: 'endMobilization' };
  const d = D(s, pick);
  if (d.kind === 'war') {
    const t = E.warTargets(s, pick);
    const best = d.attach === 'ownBomber' ? t.slice().sort((a, b) => D(s, b).bomb - D(s, a).bomb || D(s, b).def - D(s, a).def)[0]
      : t.slice().sort((a, b) => (D(s, b) ? D(s, b).cap || 0 : 0) - (D(s, a) ? D(s, a).cap || 0 : 0))[0];
    if (E.has(d, 'heavyAAA')) {
      // Cover what the enemy is most likely to hit: Industry for a production war, otherwise the Convoy.
      const can = E.aaaCovers(s);
      const cover = can.length === 1 ? can[0] : prof && prof.target === 'convoy' ? 'convoy' : 'industry';
      return { type: 'mobilize', uid: pick, attach: best, cover };
    }
    return { type: 'mobilize', uid: pick, attach: best };
  }
  return { type: 'mobilize', uid: pick };
}

/* ------------------------------------------------------------------ attack planning */
/* Last stand: one more lost carrier loses the game, and the enemy has shown a carrier strike (public info:
   seen carrier bombers not shot down, x2 from carriers, up to its carrier capacity) big enough to finish
   our weakest carrier. Then aircraft held back are worth nothing, so strike now at any real chance. */
function lastStand(s, side, mode) {
  const sc = s.options.mode === 'scenario' && E.SCENARIOS[s.options.scenario];
  const need = sc && sc.victory && sc.victory.sinkCarriers;
  const p = s.players[side], op = s.players[E.other(side)];
  if (!need || !p.carriers.length || !op.carriers.length || ((s.sunk || {})[side] || 0) < need - 1) return false;
  const downed = new Set(s.downed || []);
  const capTotal = op.carriers.reduce((x, f) => x + E.capOf(s, f), 0);
  const strike = [...new Set(((s.seen || {})[E.other(side)] || []))].map((u) => [u, D(s, u)])
    .filter(([u, d]) => d && d.kind === 'aircraft' && E.carrierCapable(d) && d.car && !downed.has(u))
    .map(([, d]) => d.car * 2).sort((x, y) => y - x).slice(0, capTotal).reduce((x, y) => x + y, 0);
  const weakest = Math.min(...p.carriers.map((f) => E.damageNeeded(s, f)));
  if (mode === 'crippled') return strike >= weakest && p.carriers.some((f) => f.hits > 0 || (f.fort || 0) < 0);
  if (mode === 'strike2') return strike >= 2 * weakest;
  if (mode === 'last') return strike >= weakest && p.carriers.length === 1 && (p.carriers[0].hits > 0 || strike >= 2 * weakest);
  return strike >= weakest;
}

/* The side racing the clock, on its last turn: losing is certain otherwise, so everything flies at the objective.
   Bombers go even when they can't take it alone: they draw interceptors that our fighters can then strike. */
function allIn(s, side) {
  const clock = E.clockLimit(s), sc = E.scenarioOf(s);
  if (!clock || !sc || sc.timeoutWinner === side || s.turnNo < clock - 1) return null;
  const objId = sc.victory && sc.victory.holdBase && sc.victory.holdBase[E.other(side)];
  const t = objId && E.attackTargets(s).find((x) => x.kind === 'airbase' && s.cards[x.uid] === objId);
  if (!t) return null;
  const p = s.players[side], cap = E.availCap(s, p, E.launchKind(s));
  let elig = p.hand.filter((u) => E.launchEligible(s, u));
  // Airbase Stage: keep carrier bombers for the Carrier Stage when there are carrier slots (damage adds up over the turn).
  if (s.stage === 'airbase' && sc.stackAirbaseDamage) {
    const cslots = E.availCap(s, p, 'carrier');
    const keep = p.hand.filter((u) => D(s, u).kind === 'aircraft' && E.carrierCapable(D(s, u)) && D(s, u).bomb).sort((a, b) => D(s, b).bomb - D(s, a).bomb).slice(0, cslots);
    elig = elig.filter((u) => !keep.includes(u));
  }
  const score = (u) => { const d = D(s, u); return (d.bomb || 0) * 10 + (E.armedWith(s, u) ? 40 : 0) + d.a2a; };
  const cards = elig.sort((a, b) => score(b) - score(a)).slice(0, cap);
  if (!cards.length || !cards.some((u) => D(s, u).bomb || D(s, u).a2a)) return null;
  const mo = p.hand.find((u) => D(s, u).special === 'opmo');
  return { type: 'launch', target: t, cards, special: mo };
}
function planRaid(s, side, prof) {
  const p = s.players[side], opp = s.players[E.other(side)];
  const kind = E.launchKind(s), cap = E.availCap(s, p, kind);
  const elig = p.hand.filter((u) => E.launchEligible(s, u));
  if (!cap || !elig.length) return null;
  const mult = s.stage === 'carrier' ? 2 : 1;
  const convMult = s.stage === 'carrier' && s.options.convoyCarrierDouble !== false ? 2 : 1;
  // Airbase stage: carrier-capable aircraft that fly in it land and miss this turn's Carrier Stage, where Carrier
  // and Convoy values double. If we have carrier slots, keep enough of them back for the carrier strike.
  let pool = elig;
  // Self-play showed this pays off only when sinking carriers wins the game (it cost games in Basic rules).
  const sc = s.options.mode === 'scenario' && E.SCENARIOS[s.options.scenario];
  const carriersWin = !!(sc && sc.victory && sc.victory.sinkCarriers);
  if (s.stage === 'airbase' && carriersWin && prof.saveCarrierPlanes !== false) {
    const cslots = E.availCap(s, p, 'carrier');
    if (cslots) {
      const cc = p.hand.filter((u) => D(s, u).kind === 'aircraft' && E.carrierCapable(D(s, u)))
        .sort((a, b) => (D(s, b).car + D(s, b).a2a) - (D(s, a).car + D(s, a).a2a)).slice(0, cslots);
      // Only worth it when that group could sink an enemy carrier in the Carrier Stage.
      const strike = cc.reduce((x, u) => x + D(s, u).car * 2, 0);
      const weakest = Math.min(...opp.carriers.map((f) => (E.has(D(s, f.uid), 'twoHits') && f.hits ? 4 : E.facDef(s, f))));
      if (opp.carriers.length && strike >= weakest) pool = elig.filter((u) => !cc.includes(u));
    }
  }
  const bombers = pool.filter((u) => dmgCapable(D(s, u)));
  if (!bombers.length) return null;
  const pure = pool.filter((u) => !dmgCapable(D(s, u)) && isFighter(D(s, u))).sort((a, b) => D(s, b).a2a - D(s, a).a2a);
  // Fighters at home defend next turn; keep some back.
  const spare = pure.slice(Math.min(prof.homeGuard, pure.length) > 0 ? 0 : 0);
  const keepHome = Math.min(prof.homeGuard, pure.length);
  const escortPool = pure.slice(0, Math.max(0, pure.length - keepHome));
  void spare;

  const aaa = (k) => opp.resWar[k].length * 2;
  const best = (stat) => [...bombers].sort((a, b) => D(s, b)[stat] - D(s, a)[stat] || D(s, b).def - D(s, a).def);
  const options = [];
  const build = (stat) => {
    const nEsc = Math.min(escortPool.length, Math.floor(Math.min(bombers.length, cap) * prof.escortRatio));
    const bs = best(stat).slice(0, Math.max(1, cap - nEsc));
    const es = escortPool.slice(0, Math.min(nEsc, cap - bs.length));
    return bs.concat(es);
  };
  const sum = (cards, f) => cards.reduce((n, u) => n + f(D(s, u)), 0);
  const w = convoyWeight(s);

  const desperate = prof.lastStand !== false && lastStand(s, side, prof.lastStand);
  // The side that has to win before the clock runs out is on its last turn.
  const clock = E.clockLimit(s), scc = E.scenarioOf(s);
  const lastChance = !!(clock && scc && scc.timeoutWinner !== side && s.turnNo >= clock - 1);
  const careful = prof.cautious;
  const lossW = desperate ? 1 : (prof.planeLoss || PLANE_LOSS);
  const outlook = (cards, dmgOf, tk) => careful ? raidOutlook(s, cards, dmgOf, enemyThreat(s, side, tk))
    : { delivered: sum(cards, dmgOf), lost: 0 };
  const allowed = new Set(E.attackTargets(s).map((t) => t.kind));
  if (allowed.has('convoy') && (prof.target === 'convoy' || prof.target === 'balanced')) {
    const cards = build('conv');
    const o = outlook(cards, (d) => d.conv * convMult, 'convoy');
    const dmg = Math.max(0, o.delivered - aaa('convoy'));
    options.push({ target: { kind: 'convoy' }, cards, lost: o.lost, value: (prof.target === 'convoy' ? 1000 + dmg : dmg * w) - o.lost * (prof.planeLoss || PLANE_LOSS) });
  }
  if (allowed.has('industry') && (prof.target === 'industry' || prof.target === 'balanced')) {
    const cards = build('bomb');
    const o = outlook(cards, (d) => d.bomb, 'industry');
    const dmg = Math.max(0, o.delivered - aaa('industry'));
    options.push({ target: { kind: 'industry' }, cards, lost: o.lost, value: (prof.target === 'industry' ? 1000 + dmg : dmg) - o.lost * (prof.planeLoss || PLANE_LOSS) });
  }
  if (prof.takeKills || !allowed.has('industry')) {
    for (const t of E.attackTargets(s)) {
      if (t.kind !== 'airbase' && t.kind !== 'carrier') continue;
      const stat = t.kind === 'carrier' ? 'car' : 'bomb';
      const moCard = p.hand.find((u) => D(s, u).special === 'opmo');
      const cards = build(stat);
      const f = E.findFac(opp, t.uid).f, td = D(s, t.uid);
      const need = E.damageNeeded(s, f);
      const safeHome = E.isHomeProtected(s, f);
      if (safeHome && !f.landed.length && !f.war.length) continue; // nothing to gain from hitting a protected empty home
      const o = outlook(cards, (d) => (t.kind === 'carrier' ? d.car * mult : d.bomb), t.kind);
      // Para-Frags: +4 for each armed bomber that gets through to an airbase.
      const pfN = t.kind === 'airbase' ? cards.filter((u) => E.armedWith(s, u)).length : 0;
      if (pfN) o.delivered += 4 * pfN * Math.max(0, 1 - o.lost / cards.length);
      // Taking the enemy's objective base, or sinking the carrier that completes the carrier victory, wins outright.
      const oppSide = E.other(side), sinkN = sc && sc.victory && sc.victory.sinkCarriers;
      const wins = !safeHome && ((t.kind === 'airbase' && sc && sc.victory && sc.victory.holdBase && sc.victory.holdBase[oppSide] === s.cards[t.uid])
        || (t.kind === 'carrier' && sinkN && ((s.sunk || {})[oppSide] || 0) >= sinkN - 1));
      const kill = wins ? WIN_VALUE : safeHome ? 0 : (t.kind === 'carrier' ? (prof.carrierKill || 14) : 10);
      // Operation MO: +1 per aircraft that gets through (up to +4), or a flat bonus.
      const moD = moCard && t.kind === 'airbase' ? D(s, moCard) : null;
      const moBonus = moD ? (moD.boostPerAircraft ? Math.min(moD.boost || 4, Math.max(0, cards.length - Math.round(o.lost))) : (moD.boost || 4)) : 0;
      const val = (k) => k + f.landed.length * 4 + f.war.length * 3 - o.lost * lossW;
      const raw = sum(cards, (d) => (t.kind === 'carrier' ? d.car * mult : d.bomb)) + 4 * pfN;
      if (o.delivered >= need) options.push({ target: t, cards, lost: o.lost, value: val(kill) });
      // Last stand: a strike that only gets there if it slips past the fighters is still worth flying.
      // It only uses deck space our carrier fighters won't need: bombers landing back on the carrier take their slots.
      else if (desperate && t.kind === 'carrier' && s.stage === 'carrier') {
        const cap2 = cap - p.hand.filter((u) => { const d = D(s, u); return isFighter(d) && d.a2a >= 3 && E.carrierCapable(d) && !cards.includes(u); }).length;
        const sc2 = cards.filter((u) => dmgCapable(D(s, u))).slice(0, Math.max(0, cap2));
        const raw2 = sum(sc2, (d) => d.car * mult);
        if (sc2.length && raw2 >= need) { const o2 = outlook(sc2, (d) => d.car * mult, 'carrier');
          options.push({ target: t, cards: sc2, lost: o2.lost, value: kill * Math.max(0.3, o2.delivered / need) + f.landed.length * 4 - o2.lost * lossW, stand: true }); }
      }
      else if (o.delivered + moBonus >= need) options.push({ target: t, cards, lost: o.lost, value: val(kill), mo: true });
      // Our last turn on the clock: a winning raid that only works if it slips past the fighters is still the best shot.
      else if (wins && (lastChance || E.turnDamage(s, f) > 0 || (prof.winGamble != null && (o.delivered + moBonus) / need >= prof.winGamble)) && raw + (moD ? Math.min(moD.boost || 4, cards.length) : 0) >= need)
        options.push({ target: t, cards, lost: o.lost, value: kill * Math.max(0.2, (o.delivered + moBonus) / need), mo: !!moD, stand: true });
      else if (s.stage === 'airbase' && t.kind === 'airbase' && !safeHome && E.stacks(s, f)) {
        // Damage adds up over the turn: soften the base now if the Carrier Stage strike (plus MO) can finish it.
        const followCards = p.hand.filter((u) => !cards.includes(u) && D(s, u).kind === 'aircraft' && E.carrierCapable(D(s, u)) && (D(s, u).bomb || 0) > 0)
          .sort((x, y) => (D(s, y).bomb || 0) - (D(s, x).bomb || 0)).slice(0, E.availCap(s, p, 'carrier'));
        const fo = outlook(followCards, (d) => d.bomb, 'airbase');
        const later = (prof.softenOutlook === false ? followCards.reduce((x, u) => x + (D(s, u).bomb || 0), 0) : fo.delivered)
          + (moD ? Math.min(moD.boost || 4, Math.max(0, followCards.length - Math.round(fo.lost))) : 0);
        if (o.delivered > 0 && o.delivered + later >= need) options.push({ target: t, cards, lost: o.lost, value: val(kill * 0.7) });
      }
    }
  }
  options.sort((a, b) => b.value - a.value);
  const o = options[0];
  if (!o || !o.cards.length) return null;
  // Careful play: hold back when the raid is expected to cost more than it gains, unless the hand is
  // overflowing or the enemy is close to collapse. Single-target profiles still respect the loss math.
  if (careful) {
    const net = o.value >= 1000 ? o.value - 1000 : o.value;
    const handFull = p.hand.length >= 12;
    const finisher = opp.industry >= 50;
    // Waiting has a shelf life: patience shrinks as the game goes on, and ends once the deck is empty,
    // so two careful players can't sit on their hands forever.
    const patience = (prof.minNet ?? 1) - s.turnNo / 8;

  }
  const mo = p.hand.find((u) => D(s, u).special === 'opmo');
  // Play MO when it is needed for the kill, or on a Carrier Stage strike at an airbase (the last chance this turn).
  const useMo = mo && o.target.kind === 'airbase' && (o.mo || s.stage === 'carrier' || !(sc && sc.stackAirbaseDamage));
  return { type: 'launch', target: o.target, cards: o.cards, special: useMo ? mo : undefined };
}

/* Fighter sweep: a fighters-only Carrier Stage raid on an enemy carrier, to draw out and shoot down its fighters
   before the bombers go in. The defender sees only the size of the raid, so it has to treat it as a strike.
   Only when: we hold bombers for the follow-up strike, the exchange looks good against the fighters we expect
   (seen ones, plus a typical 4/4 for unseen), and our own carriers stay covered while the sweep fighters are

function planSweep(s, side, prof) {

  if (!land && (!op.carriers.length || !p.carriers.length)) return null;
  // A follow-up strike: carrier bombers for a carrier sweep; any bombers for a land sweep (even this turn's Carrier Stage).
  const strikeLater = p.hand.filter((u) => { const d = D(s, u); return dmgCapable(d) && (land || (E.carrierCapable(d) && d.car)); }).length;
  if (cap < 2 || strikeLater < 2) return null;
  const strength = (u) => D(s, u).a2a + D(s, u).def;
  // Land sweeps use land-only fighters first, so carrier fighters stay back to cover the carriers.
  const fighters = p.hand.filter((u) => { const d = D(s, u); return isFighter(d) && !dmgCapable(d) && E.launchEligible(s, u); })
    .sort((x, y) => (land ? (E.carrierCapable(D(s, x)) ? 1 : 0) - (E.carrierCapable(D(s, y)) ? 1 : 0) : 0) || strength(y) - strength(x));
  const squall = p.hand.some((u) => D(s, u).special === 'rainSquall');
  const guards = (u) => { const d = D(s, u); return d.a2a >= 3 && (E.carrierCapable(d) || E.has(d, 'patrol')); };
  const reserve = squall || !p.carriers.length ? 0 : (prof.carrierDefenders ?? 1) + p.carriers.length;
  // A base we must hold keeps one fighter at home.
  const sc = s.options.mode === 'scenario' && E.SCENARIOS[s.options.scenario];
  const holdId = sc && sc.victory && sc.victory.holdBase && sc.victory.holdBase[side];
  const holdF = holdId && p.airbases.find((f) => s.cards[f.uid] === holdId);
  const homeKeep = holdF ? Math.min(prof.homeKeep ?? E.capOf(s, holdF), E.capOf(s, holdF)) : 0;
  const lossW = prof.planeLoss || PLANE_LOSS;

      const k = intel[me()][u]; return k && k.at === f.uid ? `<span class="pill ${side}">${nm(u)}</span>` : '<span class="pill unk">Unknown</span>';

    <div class="bstat">${st.map((x) => `<span>${x}</span>`).join('')}</div>

}

/* ---------------------------------------------------------------- planes */
function planesPage(side) {
  const v = me();
  if (side === v || over()) {
    const p = S.players[side], list = [];
    for (const u of p.hand) if (D(u).kind === 'aircraft') list.push({ u, foot: 'In hand', landed: false, fc: 'hand' });
    for (const k of ['airbase', 'carrier']) for (const f of E.facs(p, k)) for (const u of f.landed) list.push({ u, foot: 'Landed · ' + D(f.uid).name, landed: true });
    if (S.combat) for (const e of [...S.combat.mission, ...S.combat.intercept]) if (e.alive && !e.parked && D(e.uid).side === side) list.push({ u: e.uid, foot: 'In the air', landed: false });
    for (const pc of S.pending) if (pc.kind === 'land' && pc.player === side) for (const u of pc.planes) list.push({ u, foot: 'Landing', landed: false });
    const sec = (type, title) => { const L = list.filter((x) => D(x.u).type === type).sort((a, b) => a.landed - b.landed || D(a.u).name.localeCompare(D(b.u).name));
      return `<div class="sec-h">${title}:</div>${L.length ? `<div class="cgrid">${L.map((x) => cardHTML(x.u, { size: 'lg', landed: x.landed, foot: x.foot, footCls: x.fc })).join('')}</div>` : '<p class="empty">None.</p>'}`; };
    const lost = ((S.stats || {})[side] || {}).lost || [];
    return `${over() && side !== v ? '' : '<p class="note">Bright: in hand, ready. Faded: landed until your next turn.</p>'}${sec('fighter', 'Fighters')}${sec('bomber', 'Bombers')}
      <p class="note">${S.players[side].deck.length} cards still in the deck · ${lost.filter((u) => D(u).kind === 'aircraft').length} aircraft lost</p>`;
  }
  // Enemy: only aircraft seen face up during the last round.
  const I = intel[v], en = side;
  const ids = Object.keys(I).filter((u) => I[u].turn >= S.turnNo - 1 && D(u).side === en);
  const status = (u) => {
    if ((S.downed || []).includes(u)) return { foot: 'Shot down', dead: true };
    if (S.combat && [...S.combat.mission, ...S.combat.intercept].some((e) => e.uid === u && e.alive && !e.parked)) return { foot: 'In the air' };
    const at = facOf(S, en, u);
    if (at && I[u].at === at.f.uid) return { foot: 'Landed · ' + D(at.f.uid).name, landed: true };
    return { foot: 'Location unknown' };
  };
  const sec = (type, title) => { const L = ids.filter((u) => D(u).type === type);
    return `<div class="sec-h">${title}:</div>${L.length ? `<div class="cgrid">${L.map((u) => { const s = status(u); return cardHTML(u, { size: 'lg', dead: s.dead, landed: s.landed, foot: s.foot, footCls: 'enemy' }); }).join('')}</div>` : '<p class="empty">None seen.</p>'}`; };
  return `<p class="note">Enemy aircraft seen face up during the last round. The ${SIDE[en]} player holds ${plural(S.players[en].hand.length, 'card')}.</p>${sec('fighter', 'Fighters')}${sec('bomber', 'Bombers')}`;
}
function handPage() {
  const v = me(), p = S.players[v], fr = S.active === v ? (p.fresh || []) : [];
  const groups = [['battle', 'Battle cards'], ['war', 'War cards'], ['base', 'Airbases and carriers']];
  const nAir = p.hand.filter((u) => D(u).kind === 'aircraft').length;

  return `<p class="note">${plural(rest, 'card')} besides aircraft · ${nAir} aircraft in hand (see the ${SIDE[v]} tab). New cards are marked.</p>` + (rest ? '' : '<p class="empty">Only aircraft in hand.</p>') + groups.map(([k, t]) => {
    const L = sortHand(p.hand.filter((u) => (k === 'base' ? ['airbase', 'carrier'].includes(D(u).kind) : D(u).kind === k)));
    return L.length ? `<div class="sec-h">${t}:</div><div class="cgrid">${L.map((u) => cardHTML(u, { size: 'lg', fresh: fr.includes(u) })).join('')}</div>` : '';
  }).join('');
}

/* ---------------------------------------------------------------- reports */
function reportsPage(mode) {
  if (mode === 'war') return `${warReportHTML(me(), true)}${warReportHTML(E.other(me()), over())}<p class="note">${over() ? '' : 'Remaining enemy forces stay hidden until the game ends.'}</p>`;
  const turns = [...new Set(S.log.map((l) => l.t))].sort((a, b) => b - a);
  if (mode === 'log') {
    return turns.map((t) => { const L = S.log.filter((l) => l.t === t && l.cls !== 'turn'); const who = (L.find((l) => l.who) || {}).who;
      return `<section class="aar-box"><div class="turn-h side-${who || ''}"><span>Turn ${t}${who ? ' · ' + SIDE[who] : ''}</span></div>
        <ul class="logl">${L.map((l) => `<li class="${l.cls} side-${l.side || ''}">${esc(pubMsg(l))}</li>`).join('')}</ul></section>`; }).join('');
  }
  const unread = new Set(unseen(me()).map((r) => r.summary !== undefined ? r.summary : r.t));
  return '<p class="note">ATT | DEF = the numbers each aircraft fought with. DEF* = scouted (−1 Defense, already counted).</p>' + turns.map((t) => turnHTML(t, unread.has(t) && !over())).join('');
}

/* ---------------------------------------------------------------- how to play */
function scenarioWins(sc) {
  // Victory conditions for any scenario, from its data (alternatives: any one wins).
  const v = sc.victory || {}, hb = v.holdBase || {}, def = (id) => (sc.defs && sc.defs[id]) || E.CARD_DB[id].def, W = { allied: [], axis: [] };
  for (const side of ['allied', 'axis']) {
    const en = E.other(side);
    if (sc.timeoutWinner === side) W[side].push(hb[side] ? `${E.CARD_DB[hb[side]].name} still stands after turn ${sc.turnLimit}` : `Hold out past turn ${sc.turnLimit}`);
    if (hb[en]) W[side].push(`Destroy ${E.CARD_DB[hb[en]].name} (Defense ${def(hb[en])})`);
    if (v.sinkCarriers) W[side].push(`Sink ${v.sinkCarriers} enemy carriers`);
    if (v.kills) W[side].push(`Shoot down ${v.kills} enemy aircraft`);
  }
  return W;
}
function rulesPage(t) {
  const orList = (a) => `<ul>${a.map((x, i) => `<li>${esc(x)}${i < a.length - 1 ? ', <b>or</b>' : ''}</li>`).join('')}</ul>`;
  if (t === 'basics') return `<section class="rules">
    <p>Airwar Pacific! is a two-player card game of the air war over the Pacific, 1942–43. One player commands the <b>Allies</b>, the other the <b>Axis</b>. Each side has its own deck. You launch attacks on the enemy's airbases, carriers and shipping; your opponent scrambles fighters to stop them, and the air battle is fought card against card.</p>
    <h3>How you win</h3>
    <p>It depends on the game you play (see <b>Modes</b>). In a scenario you might have to destroy an enemy base, sink their carriers, win the air war, or simply hold out until the clock runs out. In the Campaign you wear down the enemy's Industry. Strategy → Victory Conditions shows the goals for the game you're in.</p>
    <h3>The cards</h3>
    <div class="tbl"><span class="k">Airbase</span><span>Where land aircraft fly from and land. <b>Capacity</b> is how many aircraft it can hold; <b>Defense</b> is the damage it takes to destroy it.</span>
      <span class="k">Carrier</span><span>An airbase at sea. Only aircraft marked <b>land or carrier</b> can use it. Attacks launched from carriers are Carrier Strikes.</span>
      <span class="k">Aircraft</span><span>Fighters and bombers, with the five values below.</span>
      <span class="k">War card</span><span>Put into play in Mobilization. Satellite Field and Heavy AAA attach to one of your airbases; Para-Frags arm an A-20, B-25 or B-26 in your hand (+4 against airbases until it's shot down).</span>
      <span class="k">Battle card</span><span>Played during a fight (Thatch Weave, Attack From The Sun, aces) or at a set moment (Rain Squall, Station HYPO, Operation MO).</span></div>
    <h3>Aircraft values</h3>
    <div class="tbl"><span class="k">A2A</span><span>Air to Air: shoots down an enemy aircraft whose Defense is equal or lower.</span>
      <span class="k">BMB</span><span>Bombing: damage to an airbase (and to Industry in the Campaign).</span>
      <span class="k">CAR</span><span>Damage to a carrier. Doubled in a Carrier Strike.</span>
      <span class="k">CNV</span><span>Damage to the enemy Convoy. Doubled in a Carrier Strike.</span>
      <span class="k">DEF</span><span>Defense: what an attacker needs to equal or beat. A scouted aircraft that is struck fights at DEF − 1 (shown as DEF*).</span></div>
    <h3>Special abilities</h3>
    <ul><li><b>Patrol:</b> may intercept from an airbase during the enemy's Carrier Stage.</li>
      <li><b>Interceptor +N:</b> extra A2A when attacking a bomber.</li>
      <li><b>Hit and Run</b> (Flying Tigers): can't be attacked once scouted.</li>
      <li><b>First strike</b> (VMF-214 Black Sheep): fires first; an enemy it shoots down never fires back.</li>
      <li><b>Bomber killer</b> (204th Kokutai): after shooting down a bomber it may fight once more in the same combat.</li>
      <li><b>Elite units</b> (Flying Tigers, Tainan Kokutai, VMF-214, 204th Kokutai) are unique: one copy each.</li></ul>
    <h3>Card markings</h3>
    <ul><li>An <b>anchor</b> beside the name: the aircraft can fly from carriers.</li>
      <li>A <b>parachute bomb</b>: the bomber carries Para-Frags.</li>
      <li>Base cards show a top-down airfield or carrier with its <b>Defense</b> in the red badge.</li></ul>
    <h3>Aces and markers</h3>
    <p>Every enemy aircraft a plane shoots down is painted on its card as a small flag. At <b>${E.ACE_KILLS} kills</b> it becomes an <b>Ace</b> (gold ring) and its side draws 1 card. Each time an aircraft reaches its target it earns a bomb marker, or a sinking-carrier marker if that mission sank a carrier.</p>
    <h3>What's hidden</h3>
    <p>Your hand, the aircraft in an attack until they're scouted, and which aircraft landed on which base. Your opponent only ever sees how many. In pass-and-play, a hand-off screen hides each player's cards from the other.</p>
    <h3>Using the app</h3>
    <div class="tbl"><span class="k">Orders</span><span>The decision in front of you, and what happened since you last looked.</span>
      <span class="k">Strategy</span><span>Both sides' situation, the clock, and the victory conditions.</span>
      <span class="k">Bases</span><span>Every airbase and carrier, their damage and what is landed on them.</span>
      <span class="k">Planes</span><span>Your aircraft, enemy aircraft seen in the last round, and the rest of your hand.</span>
      <span class="k">Reports</span><span>Every after-action report, the full log and the war record.</span>
      <span class="k">•••</span><span>Undo, full screen, copy a game report, new game.</span></div></section>`;
  if (t === 'turn') return `<section class="rules">
    <p>Players take turns. Each turn has three stages, in this order.</p>
    <h3>1. Mobilization</h3>
    <ul><li>Draw 3 cards and keep 2; the third goes back into your deck. (The player who moves first doesn't draw on turn 1.)</li>
      <li>Aircraft that landed last turn come back to your hand.</li>
      <li>Put any number of airbases, carriers and war cards into play. Cards in play can be attacked.</li></ul>
    <h3>2. Airbase Stage: one Attack Mission</h3>

      <span class="k">Carrier</span><span>Total CAR (doubled in a Carrier Strike). Yorktown takes two hits: Defense 9, then 4.</span>
      <span class="k">Convoy</span><span>Total CNV (doubled in a Carrier Strike). At 15 the convoy is sunk: the track resets and that side discards 2 cards (and in scenarios suffers a special effect).</span>
      <span class="k">Industry</span><span>Campaign only: total BMB. 60 damage loses the war.</span></div>
    <ul><li>In scenarios, damage to the same base or carrier from your Attack Mission and Carrier Strike in one turn <b>adds up</b>.</li>

    <h3>Landing</h3>
    <p>After a fight, survivors land: Attack Mission aircraft on airbases, Carrier Strike aircraft on carriers. Where there's a choice you pick the base; your opponent sees only the numbers. An aircraft with nowhere to land returns to your hand.</p>
    <h3>Running out</h3>
    <p>A side whose deck is empty and that can no longer launch an attack loses, if the other side can still do damage.</p></section>`;
  if (t === 'combat') return `<section class="rules">
    <h3>Interception</h3>
    <ul><li>When attacked, you may <b>scramble fighters</b> (A2A 1 or more) from your hand, up to your free capacity, or let the attack through.</li>
      <li>You commit the whole group at once; you can't add more later. Aircraft still landed can't intercept.</li>
      <li>Against an Attack Mission you use airbase slots (plus carrier slots if a carrier is the target). Against a Carrier Strike you use carrier slots (plus airbase slots if an airbase is the target); <b>Patrol</b> fighters may also use airbase slots.</li>
      <li>Instead of intercepting you can play <b>Rain Squall / Weather Front</b> (carrier under attack), or first play <b>Station HYPO / Coastwatchers</b> to reveal every incoming aircraft.</li></ul>
    <h3>Engagements</h3>
    <ul><li>Fights are one aircraft against one. The defender picks one of its interceptors and either a <b>hidden attacker</b> (a blind draw, which is then scouted) or a <b>scouted attacker</b> (a strike: it fights at DEF − 1).</li>
      <li><b>Both fire at once:</b> each aircraft shoots the other down if its A2A (at least 1) equals or beats the other's Defense. Both can go down.</li>
      <li>Each aircraft fights only once per combat. A bomber can't start a fight.</li>
      <li>After a fight, the side that lost moves next. If an interceptor survives, the attacker may strike it with a fighter that hasn't fought, or hold, and the scouted interceptor escapes to land.</li>
      <li>The defender may end combat at any time; every surviving attacker reaches the target.</li></ul>
    <h3>Battle cards</h3>
    <ul><li>Played once a fight is declared, before it resolves; one per side per fight.</li>

    return `<div class="box"><h4>${esc(sc.name)} · ${esc(sc.date)}</h4><p>${esc(sc.blurb)}</p>

      <b style="color:var(--allied-text)">The Allies win:</b>${orList(W.allied)}<b style="color:var(--axis-text)">The Axis wins:</b>${orList(W.axis)}</div>`; }).join('');

    <h3>Scenarios</h3>

}

    <div class="label">Options</div>
    <p class="note">Choosing a mode sets the surprise attack and Axis head start to the values closest to 50/50 in computer test games.</p>
    <label class="tog"><input type="checkbox" id="opt-surprise" ${newOpts.surpriseAttack ? 'checked' : ''}><span>Pearl Harbor surprise attack<small>On turn 1 the Allies cannot intercept.</small></span></label>
    <label class="tog sel"><span>Axis head start</span><select id="opt-bonus">${[0, 1, 2, 3].map((n) => `<option value="${n}" ${((newOpts.bonusCards || {}).axis || 0) === n ? 'selected' : ''}>${n ? `+${n} card${n > 1 ? 's' : ''}` : 'None'}</option>`).join('')}</select></label>
    <label class="tog"><input type="checkbox" id="opt-keep" ${newOpts.drawKeep ? 'checked' : ''}><span>Draw 3, keep 2<small>Shuffle the third card back into your deck.</small></span></label>
    <label class="tog"><input type="checkbox" id="opt-home" ${newOpts.indestructibleHome ? 'checked' : ''}><span>Protected home airbase<small>A hit wipes what is on it instead of destroying it.</small></span></label>
    <label class="tog"><input type="checkbox" id="opt-convoy" ${newOpts.convoyDiscards === 1 ? 'checked' : ''}><span>Lighter convoy losses<small>A sunk convoy costs 1 card instead of 2.</small></span></label>
    <label class="tog"><input type="checkbox" id="opt-single" ${newOpts.singleMobilization ? 'checked' : ''}><span>Single mobilization per turn</span></label>
    <label class="tog"><input type="checkbox" id="opt-exp" ${newOpts.expansion1942 || forced ? 'checked' : ''} ${forced ? 'disabled' : ''}><span>Include the 1942 expansion<small>${forced ? 'Required by this scenario.' : 'Adds 9 cards to each deck.'}</small></span></label>
    <p class="note">Starting replaces the current game.</p>
    <div class="actions">${S && S.phase ? btn('cancelNew', 'Back') : ''}${btn('startNew', 'Start game', { cls: 'go' })}</div>`;
}

function statusHTML() {
  if (over()) return `<b>Game over</b> · ${S.winner === 'draw' ? 'Draw' : `<span class="s-${S.winner}">${SIDE[S.winner]} victory</span>`}`;
  const st = S.stage === 'setup' ? 'Opening hands' : S.stage === 'mobilize' ? 'Mobilization' : S.stage === 'airbase' ? '<span class="st-airbase">Attack Missions</span>' : '<span class="st-carrier">Carrier Strikes</span>';
  const sc = scen(), lim = sc && sc.turnLimit ? `/${E.clockLimit(S)}` : '';

}
function decisionKey() { return `${S.phase}|${E.actorOf(S)}|${S.turnNo}|${S.stage}|${S.raidNo || 0}|${(S.pending[0] || {}).kind || ''}|${S.combat && S.combat.turn}`; }
function frame(title, segs, body, o) {
  o = o || {};
  const segH = segs ? `<nav class="seg" aria-label="${esc(title)} views">${segs.map(([k, l, cls]) => `<button class="${cls || ''} ${o.seg === k ? 'on' : ''}" data-btn="${o.segBtn || 'sub'}" data-arg="${k}" aria-pressed="${o.seg === k}">${l}</button>`).join('')}</nav>` : '<div></div>';
  const nav = o.noNav ? '' : `<nav class="nav" aria-label="Main">${TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-btn="tab" data-arg="${k}" aria-current="${tab === k ? 'page' : 'false'}">${ico(k, 26)}<span>${l}</span>${o.badges && o.badges[k] ? `<span class="badge ${o.badges[k] === true ? 'dot' : ''}">${o.badges[k] === true ? '' : o.badges[k]}</span>` : ''}</button>`).join('')}</nav>`;
  return `<div class="frame">
    <header class="hdr"><div class="hdr-bar">
        <button class="iconbtn ${rules ? 'on' : ''}" data-btn="rules" aria-label="${rules ? 'Close the rules' : 'How to play'}">${ico(rules ? 'close' : 'book', 24)}</button>
        <div class="logo">${LOGO}</div>
        ${o.noMenu ? '<span></span>' : `<button class="iconbtn" data-btn="menu" aria-label="Menu">${ico('more', 22)}</button>`}</div>
      <div class="hdr-top"><span class="status">${o.noStatus ? `${esc(modeName())}` : statusHTML()}</span></div>
      <h1 class="ptitle">${title}</h1></header>
    ${segH}<main class="main" id="main">${body}</main>${nav}${o.overlay || ''}</div>`;
}

const HKEY = 'awp-history';
const loadHist = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; } };
const htmlText = (h) => h.replace(/<li[^>]*>/g, '\n  - ').replace(/<h4>/g, '\n').replace(/<div class="label">/g, '\n ').replace(/<br>/g, '\n')
  .replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/\n\s*\n+/g, '\n');
function reportText() {
  const sc = scen(), o = S.options, full = over(), L = [];

  L.push('AIRWAR PACIFIC! GAME REPORT', `Exported ${now.getFullYear()}-${d2(now.getMonth() + 1)}-${d2(now.getDate())} ${d2(now.getHours())}:${d2(now.getMinutes())}`, '');
  L.push(`Game: ${modeName()}${sc ? ' (scenario)' : ''}`);
  L.push(`Players: ${aiSide() ? `human ${SIDE[human()]} vs computer ${SIDE[aiSide()]} (${o.ai.profile})` : 'pass and play'}`);
  L.push(`Options: Axis +${(o.bonusCards || {}).axis || 0} cards; surprise attack ${o.surpriseAttack ? 'on' : 'off'}; draw 3 keep 2 ${o.drawKeep ? 'on' : 'off'}; protected home ${o.indestructibleHome ? 'on' : 'off'}; convoy discards ${o.convoyDiscards ?? 2}${o.singleMobilization ? '; single mobilization' : ''}`);
  L.push(full ? `Result: ${S.winner === 'draw' ? 'Draw' : SIDE[S.winner] + ' victory'} on turn ${S.turnNo}. ${S.endReason || ''}` : `In progress: turn ${S.turnNo}${sc && sc.turnLimit ? ' of ' + E.clockLimit(S) : ''}, ${SIDE[S.active]} to play.`);
  L.push('');
  for (const sd of ['allied', 'axis']) {
    const p = S.players[sd], st = (S.stats || {})[sd] || {};
    const kills = (S.downed || []).filter((u) => D(u).side !== sd).length;
    L.push(`${SIDE[sd].toUpperCase()}: enemy aircraft shot down ${kills}; carriers lost ${(S.sunk || {})[sd] || 0}; convoy ${p.convoy}/15 (sunk ${p.convoysLost || 0}x)${sc && sc.noIndustry ? '' : `; Industry ${p.industry}/${E.industryMax(S)}`}; deck ${p.deck.length}, hand ${p.hand.length}`);
    const vets = Object.keys(S.cards).filter((u) => D(u).side === sd && D(u).kind === 'aircraft' && ((st.kills || {})[u] || (st.missions || {})[u]))
      .sort((a, b) => ((st.kills || {})[b] || 0) - ((st.kills || {})[a] || 0));
    for (const u of vets) L.push(`  ${D(u).name}: ${plural((st.kills || {})[u] || 0, 'kill')}${((st.kills || {})[u] || 0) >= E.ACE_KILLS ? ' (ACE)' : ''}, ${plural((st.missions || {})[u] || 0, 'mission')} over target${(S.downed || []).includes(u) ? ', lost' : ''}`);
